name: Build and Publish Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # so publica a partir do repositorio de producao: o mesmo codigo tambem vive
    # no repositorio de teste (Vercel), onde nao ha imagem nem Portainer
    if: github.repository == 'cppemsistemas/site-cppem'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: CHECK
        uses: actions/checkout@v5

      - name: SETUP DOCKER
        uses: docker/setup-buildx-action@v4

      - name: LOGIN GHCR - ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: METADATA
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: BUILD
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Disparar Webhook do Portainer
        run: |
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
